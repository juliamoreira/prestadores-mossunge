<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prestadores de serviço Mossunge</title>
<style>
  :root {
    --bg: #f7f8fa; --surface: #ffffff; --text: #18202e; --muted: #667085;
    --line: #e6e8ec; --focus: #1f3864; --wa: #0f7d41; --wa-hover: #0b6634;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .page { max-width: 1240px; margin: 0 auto; padding: 0 32px 72px; }
  h1 { margin: 0; padding: 48px 0 12px; font-size: 1.75rem; line-height: 1.2; letter-spacing: -0.01em; }

  /* Barra de busca e filtro: fica visível enquanto a lista rola */
  .bar {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: flex; align-items: center; gap: 14px; padding: 12px 0 16px;
  }
  .search, .filtro {
    padding: 12px 16px; font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 10px;
  }
  .search { flex: 1; min-width: 0; }
  .filtro { width: 300px; max-width: 40%; min-width: 0; }
  .search:focus-visible, .filtro:focus-visible, .btn:focus-visible, .mais:focus-visible {
    outline: 3px solid var(--focus); outline-offset: 2px;
  }
  .count { color: var(--muted); font-size: .9rem; white-space: nowrap; min-width: 96px; text-align: right; }

  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0;
    transition: border-color .15s, box-shadow .15s;
  }
  .card:hover { border-color: #cfd4dc; box-shadow: 0 4px 14px rgba(24, 32, 46, .06); }
  .esp { font-size: .78rem; font-weight: 600; color: var(--muted); overflow-wrap: anywhere; }
  .card h2 { margin: 0; font-size: 1.05rem; line-height: 1.3; overflow-wrap: anywhere; }
  .tel { color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .acao { margin-top: auto; padding-top: 14px; }
  .btn {
    display: block; text-align: center; padding: 10px 14px; border-radius: 8px;
    background: var(--wa); color: #fff; text-decoration: none; font-size: .92rem; font-weight: 600;
    transition: background .15s;
  }
  .btn:hover { background: var(--wa-hover); }
  .sem {
    display: block; text-align: center; padding: 10px 14px; border-radius: 8px;
    background: #f1f2f4; color: var(--muted); font-size: .92rem;
  }

  .status { padding: 64px 0; text-align: center; color: var(--muted); }
  .status:empty { display: none; }
  .mais {
    display: block; margin: 28px auto 0; padding: 11px 24px; font: inherit; font-weight: 600;
    color: var(--focus); background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; cursor: pointer;
  }
  .mais:hover { border-color: #cfd4dc; }
  .mais[hidden] { display: none; }

  @media (max-width: 720px) {
    .page { padding: 0 16px 48px; }
    h1 { padding-top: 28px; }
    .bar { flex-wrap: wrap; gap: 10px; }
    .search { flex-basis: 100%; }
    .filtro { flex: 1; max-width: none; width: auto; }
  }
</style>
</head>
<body>
<main class="page">
  <h1 id="titulo"></h1>

  <div class="bar">
    <input id="busca" class="search" type="search" placeholder="Buscar por nome ou especialidade" aria-label="Buscar prestadores" autocomplete="off">
    <select id="filtro" class="filtro" aria-label="Filtrar por especialidade"></select>
    <div id="contagem" class="count" aria-live="polite"></div>
  </div>

  <div id="cards" class="grid"></div>
  <div id="status" class="status">Carregando…</div>
  <button id="mais" class="mais" type="button" hidden></button>
</main>

<script>
  // ===== Configuração: é só isto que muda =====
  const CONFIG = {
    titulo: "Prestadores de serviço Mossunge",
    // Link da planilha Google (colunas: Nome, Especialidade, Telefone).
    // Serve o link normal da planilha (com acesso "Qualquer pessoa com o link: Leitor")
    // ou o link CSV de "Arquivo > Compartilhar > Publicar na Web". Se o link vier de uma
    // aba específica (termina em #gid=...), essa aba é usada; senão, a primeira.
    planilha: "https://docs.google.com/spreadsheets/d/1Td33LcRFpo2XsR8SrqgtkgUsjraTWS6An2WWu6v-beE/edit?usp=sharing",
    mensagem: "Olá! Quero um orçamento.", // texto que já vem escrito no WhatsApp
    ddi: "55",                            // código do país usado quando o número vem sem ele
    porPagina: 60                         // quantos cards aparecem antes de "Mostrar mais"
  };
  // ============================================

  const CACHE_KEY = "prestadores-cache-v2";
  const TODAS = "";
  const $ = (id) => document.getElementById(id);
  let todos = [];
  let visiveis = CONFIG.porPagina;

  document.title = CONFIG.titulo;
  $("titulo").textContent = CONFIG.titulo;

  const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();

  // CSV -> matriz (aceita aspas, vírgulas e quebras de linha dentro da célula)
  function lerCSV(texto) {
    const linhas = []; let linha = [], celula = "", aspas = false;
    for (let i = 0; i < texto.length; i++) {
      const c = texto[i];
      if (aspas) {
        if (c === '"' && texto[i + 1] === '"') { celula += '"'; i++; }
        else if (c === '"') aspas = false;
        else celula += c;
      } else if (c === '"') aspas = true;
      else if (c === ",") { linha.push(celula); celula = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && texto[i + 1] === "\n") i++;
        linha.push(celula); linhas.push(linha); linha = []; celula = "";
      } else celula += c;
    }
    if (celula !== "" || linha.length) { linha.push(celula); linhas.push(linha); }
    return linhas;
  }

  // Lê as colunas pelo nome do cabeçalho; colunas extras são ignoradas.
  function lerPrestadores(matriz) {
    if (!matriz.length) return [];
    const cab = matriz[0].map(norm);
    const col = (...nomes) => cab.findIndex((h) => nomes.some((n) => h.startsWith(n)));
    const iNome = col("nome"), iEsp = col("especialidade", "categoria"), iTel = col("telefone", "contato", "whatsapp");
    const pega = (l, i) => (i >= 0 && l[i] ? l[i].trim() : "");
    return matriz.slice(1)
      .map((l) => ({ nome: pega(l, iNome), esp: pega(l, iEsp), tel: pega(l, iTel) }))
      .filter((p) => p.nome && !norm(p.nome).includes("apague esta linha"))
      .sort((a, b) => a.esp.localeCompare(b.esp, "pt-BR") || a.nome.localeCompare(b.nome, "pt-BR"));
  }

  // Devolve só os dígitos com código do país, ou null se não parecer um telefone.
  function numeroWhatsApp(bruto) {
    const internacional = bruto.trim().startsWith("+");
    let d = bruto.replace(/\D/g, "");
    if (!internacional) {
      d = d.replace(/^0+/, "");                       // tira o 0 antes do DDD
      if (d.length === 10 || d.length === 11) d = CONFIG.ddi + d;
    }
    return d.length >= 11 && d.length <= 15 ? d : null;
  }

  // (41) 99876-5432 para números brasileiros; os demais ficam como foram digitados.
  function exibirTelefone(bruto, numero) {
    if (numero && numero.startsWith("55") && (numero.length === 12 || numero.length === 13)) {
      const local = numero.slice(2), ddd = local.slice(0, 2), resto = local.slice(2);
      return "(" + ddd + ") " + resto.slice(0, resto.length - 4) + "-" + resto.slice(-4);
    }
    return bruto;
  }

  function el(tag, classe, texto) {
    const n = document.createElement(tag);
    if (classe) n.className = classe;
    if (texto != null) n.textContent = texto;
    return n;
  }

  function cartao(p) {
    const numero = numeroWhatsApp(p.tel);
    const card = el("article", "card");
    if (p.esp) card.append(el("div", "esp", p.esp));
    card.append(el("h2", null, p.nome));
    if (p.tel) card.append(el("div", "tel", exibirTelefone(p.tel, numero)));
    const acao = el("div", "acao");
    if (numero) {
      const a = el("a", "btn", "Orçamento no WhatsApp");
      a.href = "https://wa.me/" + numero + "?text=" + encodeURIComponent(CONFIG.mensagem);
      a.target = "_blank"; a.rel = "noopener";
      a.setAttribute("aria-label", "Pedir orçamento a " + p.nome + " pelo WhatsApp");
      acao.append(a);
    } else acao.append(el("span", "sem", "Sem WhatsApp"));
    card.append(acao);
    return card;
  }

  function filtrar() {
    const q = norm($("busca").value), esp = $("filtro").value;
    return todos.filter((p) =>
      (esp === TODAS || p.esp === esp) &&
      (!q || norm(p.nome + " " + p.esp + " " + p.tel.replace(/\D/g, "")).includes(q)));
  }

  function desenhar() {
    const lista = filtrar();
    const parte = lista.slice(0, visiveis);
    const resto = lista.length - parte.length;
    $("cards").replaceChildren(...parte.map(cartao));
    $("contagem").textContent = lista.length === 1 ? "1 prestador" : lista.length + " prestadores";
    $("mais").hidden = resto <= 0;
    $("mais").textContent = "Mostrar mais (" + resto + ")";
    $("status").textContent = lista.length ? "" : (todos.length ? "Nenhum prestador encontrado." : "A lista ainda está vazia.");
  }

  // Preenche o filtro com as especialidades da planilha e a quantidade de cada uma.
  function preencherFiltro() {
    const atual = $("filtro").value;
    const contagem = new Map();
    todos.forEach((p) => p.esp && contagem.set(p.esp, (contagem.get(p.esp) || 0) + 1));
    const nomes = [...contagem.keys()].sort((a, b) => a.localeCompare(b, "pt-BR"));
    const opcao = (valor, texto) => { const o = el("option", null, texto); o.value = valor; return o; };
    $("filtro").replaceChildren(
      opcao(TODAS, "Todas as especialidades"),
      ...nomes.map((n) => opcao(n, n + " (" + contagem.get(n) + ")")));
    $("filtro").value = contagem.has(atual) ? atual : TODAS;
  }

  function usar(csv) {
    todos = lerPrestadores(lerCSV(csv));
    visiveis = CONFIG.porPagina;
    preencherFiltro();
    desenhar();
  }

  // Transforma o link colado em CONFIG.planilha no endereço que devolve os dados em CSV.
  function urlDosDados(link) {
    if (/\/d\/e\//.test(link)) return link;                  // link de "Publicar na Web": já é o CSV
    const id = (link.match(/\/d\/([\w-]+)/) || [, link.trim()])[1];  // aceita o link inteiro ou só o ID
    const gid = (link.match(/[#&?]gid=(\d+)/) || [])[1];
    return "https://docs.google.com/spreadsheets/d/" + id + "/gviz/tq?tqx=out:csv&headers=1" + (gid ? "&gid=" + gid : "");
  }

  async function carregar() {
    try {
      const res = await fetch(urlDosDados(CONFIG.planilha), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const csv = await res.text();
      if (/^\s*<(!doctype|html)/i.test(csv)) throw new Error("A planilha não está aberta para leitura por link.");
      usar(csv);
      try { localStorage.setItem(CACHE_KEY, csv); } catch (e) {}
    } catch (erro) {
      console.error("Falha ao carregar a planilha:", erro);
      let salvo = null;
      try { salvo = localStorage.getItem(CACHE_KEY); } catch (e) {}
      if (salvo) { usar(salvo); $("contagem").textContent += " (versão salva)"; }
      else $("status").textContent = "Não foi possível carregar a lista agora. Tente de novo em instantes.";
    }
  }

  const refazer = () => { visiveis = CONFIG.porPagina; desenhar(); };
  $("busca").addEventListener("input", refazer);
  $("filtro").addEventListener("change", refazer);
  $("mais").addEventListener("click", () => { visiveis += CONFIG.porPagina; desenhar(); });
  carregar();
</script>
</body>
</html>
