<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prestadores de serviço Mossunge</title>
<style>
  :root {
    --bg: #f7f8fa; --surface: #ffffff; --text: #18202e; --muted: #667085;
    --line: #e6e8ec; --head: #f9fafb; --focus: #1f3864;
    --wa: #0f7d41; --wa-hover: #0b6634;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .page { max-width: 1040px; margin: 0 auto; padding: 56px 24px 72px; }
  h1 { margin: 0 0 28px; font-size: 1.75rem; line-height: 1.2; letter-spacing: -0.01em; }

  .bar { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .search {
    flex: 1; padding: 12px 16px; font: inherit; color: var(--text);
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  }
  .search:focus-visible, .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .count { color: var(--muted); font-size: .9rem; white-space: nowrap; min-width: 90px; text-align: right; }

  .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: clip; }
  table { width: 100%; border-collapse: collapse; }
  th {
    position: sticky; top: 0; background: var(--head); text-align: left;
    padding: 12px 20px; font-size: .75rem; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line);
  }
  td { padding: 14px 20px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: #fbfcfd; }
  .nome { font-weight: 600; }
  .esp { color: var(--muted); }
  .tel { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .acao { text-align: right; white-space: nowrap; }

  .btn {
    display: inline-block; padding: 8px 16px; border-radius: 8px; background: var(--wa);
    color: #fff; text-decoration: none; font-size: .9rem; font-weight: 600;
    transition: background .15s;
  }
  .btn:hover { background: var(--wa-hover); }
  .sem { color: var(--muted); font-size: .9rem; }

  .status { padding: 48px 20px; text-align: center; color: var(--muted); }
  .status:empty { display: none; }

  @media (max-width: 720px) {
    .page { padding: 28px 16px 48px; }
    .tel-col { display: none; }
    th, td { padding-left: 12px; padding-right: 12px; }
  }
</style>
</head>
<body>
<main class="page">
  <h1 id="titulo"></h1>

  <div class="bar">
    <input id="busca" class="search" type="search" placeholder="Buscar por nome ou especialidade" aria-label="Buscar prestadores" autocomplete="off">
    <div id="contagem" class="count" aria-live="polite"></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th scope="col">Nome</th>
          <th scope="col">Especialidade</th>
          <th scope="col" class="tel-col">Telefone</th>
          <th scope="col"><span style="position:absolute;left:-9999px">Ação</span></th>
        </tr>
      </thead>
      <tbody id="linhas"></tbody>
    </table>
    <div id="status" class="status">Carregando…</div>
  </div>
</main>

<script>
  // ===== Configuração: é só isto que muda =====
  const CONFIG = {
    titulo: "Prestadores de serviço Mossunge",
    // Link da planilha Google (colunas: Nome, Especialidade, Telefone).
    // Serve o link normal da planilha (com acesso "Qualquer pessoa com o link: Leitor")
    // ou o link CSV de "Arquivo > Compartilhar > Publicar na Web". Se o link vier de uma
    // aba específica (termina em #gid=...), essa aba é usada; senão, a primeira.
    planilha: "https://docs.google.com/spreadsheets/d/1mWSnaTyH_S2qUyrP3NEo8gEjFJy_YxAkkFDS8qRz7Xc/edit",
    mensagem: "Olá! Quero um orçamento.", // texto que já vem escrito no WhatsApp
    ddi: "55"                             // código do país usado quando o número vem sem ele
  };
  // ============================================

  const CACHE_KEY = "prestadores-cache-v2";
  const $ = (id) => document.getElementById(id);
  let todos = [];

  document.title = CONFIG.titulo;
  $("titulo").textContent = CONFIG.titulo;

  const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();

  // CSV -> matriz (aceita aspas, vírgulas e quebras de linha dentro da célula)
  function lerCSV(texto) {
    const linhas = []; let linha = [], celula = "", aspas = false;
    for (let i = 0; i < texto.length; i++) {
      const c = texto[i];
      if (aspas) {
        if (c === '"' && texto[i + 1] === '"') { celula += '"'; i++; }
        else if (c === '"') aspas = false;
        else celula += c;
      } else if (c === '"') aspas = true;
      else if (c === ",") { linha.push(celula); celula = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && texto[i + 1] === "\n") i++;
        linha.push(celula); linhas.push(linha); linha = []; celula = "";
      } else celula += c;
    }
    if (celula !== "" || linha.length) { linha.push(celula); linhas.push(linha); }
    return linhas;
  }

  // Lê as colunas pelo nome do cabeçalho; colunas extras são ignoradas.
  function lerPrestadores(matriz) {
    if (!matriz.length) return [];
    const cab = matriz[0].map(norm);
    const col = (...nomes) => cab.findIndex((h) => nomes.some((n) => h.startsWith(n)));
    const iNome = col("nome"), iEsp = col("especialidade", "categoria"), iTel = col("telefone", "contato", "whatsapp");
    const pega = (l, i) => (i >= 0 && l[i] ? l[i].trim() : "");
    return matriz.slice(1)
      .map((l) => ({ nome: pega(l, iNome), esp: pega(l, iEsp), tel: pega(l, iTel) }))
      .filter((p) => p.nome && !norm(p.nome).includes("apague esta linha"))
      .sort((a, b) => a.esp.localeCompare(b.esp, "pt-BR") || a.nome.localeCompare(b.nome, "pt-BR"));
  }

  // Devolve só os dígitos com código do país, ou null se não parecer um telefone.
  function numeroWhatsApp(bruto) {
    const internacional = bruto.trim().startsWith("+");
    let d = bruto.replace(/\D/g, "");
    if (!internacional) {
      d = d.replace(/^0+/, "");                       // tira o 0 antes do DDD
      if (d.length === 10 || d.length === 11) d = CONFIG.ddi + d;
    }
    return d.length >= 11 && d.length <= 15 ? d : null;
  }

  // (41) 99876-5432 para números brasileiros; os demais ficam como foram digitados.
  function exibirTelefone(bruto, numero) {
    if (numero && numero.startsWith("55") && (numero.length === 12 || numero.length === 13)) {
      const local = numero.slice(2), ddd = local.slice(0, 2), resto = local.slice(2);
      return "(" + ddd + ") " + resto.slice(0, resto.length - 4) + "-" + resto.slice(-4);
    }
    return bruto;
  }

  function el(tag, classe, texto) {
    const n = document.createElement(tag);
    if (classe) n.className = classe;
    if (texto != null) n.textContent = texto;
    return n;
  }

  function linhaDaTabela(p) {
    const numero = numeroWhatsApp(p.tel);
    const tr = el("tr");
    tr.append(el("td", "nome", p.nome), el("td", "esp", p.esp), el("td", "tel tel-col", exibirTelefone(p.tel, numero)));
    const acao = el("td", "acao");
    if (numero) {
      const a = el("a", "btn", "Orçamento no WhatsApp");
      a.href = "https://wa.me/" + numero + "?text=" + encodeURIComponent(CONFIG.mensagem);
      a.target = "_blank"; a.rel = "noopener";
      a.setAttribute("aria-label", "Pedir orçamento a " + p.nome + " pelo WhatsApp");
      acao.append(a);
    } else acao.append(el("span", "sem", "Sem WhatsApp"));
    tr.append(acao);
    return tr;
  }

  function desenhar() {
    const q = norm($("busca").value);
    const lista = todos.filter((p) => !q || norm(p.nome + " " + p.esp + " " + p.tel.replace(/\D/g, "")).includes(q));
    $("linhas").replaceChildren(...lista.map(linhaDaTabela));
    $("contagem").textContent = lista.length === 1 ? "1 prestador" : lista.length + " prestadores";
    $("status").textContent = lista.length ? "" : (todos.length ? "Nenhum prestador encontrado." : "A lista ainda está vazia.");
  }

  function usar(csv) { todos = lerPrestadores(lerCSV(csv)); desenhar(); }

  // Transforma o link colado em CONFIG.planilha no endereço que devolve os dados em CSV.
  function urlDosDados(link) {
    if (/\/d\/e\//.test(link)) return link;                  // link de "Publicar na Web": já é o CSV
    const id = (link.match(/\/d\/([\w-]+)/) || [, link.trim()])[1];  // aceita o link inteiro ou só o ID
    const gid = (link.match(/[#&?]gid=(\d+)/) || [])[1];
    return "https://docs.google.com/spreadsheets/d/" + id + "/gviz/tq?tqx=out:csv" + (gid ? "&gid=" + gid : "");
  }

  async function carregar() {
    try {
      const res = await fetch(urlDosDados(CONFIG.planilha), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const csv = await res.text();
      if (/^\s*<(!doctype|html)/i.test(csv)) throw new Error("A planilha não está aberta para leitura por link.");
      usar(csv);
      try { localStorage.setItem(CACHE_KEY, csv); } catch (e) {}
    } catch (erro) {
      console.error("Falha ao carregar a planilha:", erro);
      let salvo = null;
      try { salvo = localStorage.getItem(CACHE_KEY); } catch (e) {}
      if (salvo) { usar(salvo); $("contagem").textContent += " (versão salva)"; }
      else $("status").textContent = "Não foi possível carregar a lista agora. Tente de novo em instantes.";
    }
  }

  $("busca").addEventListener("input", desenhar);
  carregar();
</script>
</body>
</html>
